<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Page</title>
    <link rel="stylesheet" href="order.css">
</head>
<body>
    <div class="navbar">
        <h1>Your Order</h1>
    </div>
    <div class="container">
        <h2>Cart Summary</h2>
        <div class="cart">
            <div class="item">
                <h3>Grilled Chicken</h3>
                <p>Quantity: 2</p>
                <p>Total: $25.98</p>
                <button class="btn">Remove</button>
            </div>
            <div class="item">
                <h3>Chocolate Cake</h3>
                <p>Quantity: 1</p>
                <p>Total: $6.99</p>
                <button class="btn">Remove</button>
            </div>
        </div>
        <div class="checkout">
            <h3>Total: $32.97</h3>
            <button class="btn">Proceed to Checkout</button>
        </div>
    </div>
</body>
</html>
