<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="stylesheet" href="profile.css">
</head>
<body>
    <div class="navbar">
        <h1>User Profile</h1>
    </div>
    <div class="container">
        <div class="profile-info">
            <h2>Your Information</h2>
            <label>Name:</label>
            <p>John Doe</p>

            <label>Email:</label>
            <p>john@example.com</p>

            <label>Phone:</label>
            <p>+123456789</p>

            <button class="btn">Edit Profile</button>
        </div>

        <div class="order-history">
            <h2>Order History</h2>
            <div class="order">
                <p>Order #12345</p>
                <p>Date: 2024-10-01</p>
                <p>Total: $29.99</p>
                <button class="btn">Reorder</button>
            </div>
            <div class="order">
                <p>Order #12344</p>
                <p>Date: 2024-09-25</p>
                <p>Total: $19.99</p>
                <button class="btn">Reorder</button>
            </div>
        </div>
    </div>
</body>
</html>
